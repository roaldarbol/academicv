# Document settings
settings:
  font_heading: "Libertinus Serif"
  font_body: "Libertinus Serif"
  # size_heading:
  # size_section_heading:
  # size_primary: 12pt
  # size_secondary:
  # size_tertiary:
  style_heading: normal # normal, smallcaps, allcaps?
  color_heading: black
  color_body: black
  color_hyperlink: rgb(230, 130, 87)   # Can be either a colour string or a rgb() value
  spacing_section: 12pt  # Space between sections. Must be a string with unit
  spacing_entry: 0.1em   # Space between entries within a section. Must be a string with unit
  spacing_element: 5pt   # Space between elements within an entry. Must be a string with unit
  spacing_line: 5pt      # Space between lines within an element. Must be a string with unit
  page:
    paper: "a4"
    numbering: "1 / 1"
    number-align: "center"  # Must be "center", "left", or "right"
    margin: 3.5cm        # Must be a string with unit

# Section definitions and content
sections:
  - key: personal
    show: false
    layout: header
    primary_element: name
    secondary_element: ["email"]
    tertiary_element: 
    entries:
      - name: Mikkel Roald-Arbøl
        email: mikkel@roald-arboel.com
        phone: (+45) 20320399
        website: https://roald-arboel.com
        title: 
          - "Doctoral Researcher in Computational ethology"
        location:
          city: Copenhagen
          region: Copenhagen
          country: Denmark
        profiles:
          - network: GitHub
            username: roaldarbol
            url: https://github.com/roaldarbol

  - key: education
    title: Education
    show: true
    layout: timeline
    primary_element: ["institution"]
    secondary_element: ["title"]
    entries:
      - institution: University of Sussex
        location: Brighton, UK
        title: Ph.D. in Biology
        start_date: 2020
        end_date: Present
      - institution: University of Copenhagen
        location: Copenhagen, DK
        title: M.Sc. in Human Biology
        start_date: 2017
        end_date: 2019
      - institution: University of Copenhagen
        location: Copenhagen, DK
        title: B.Sc. in Exercise and Sports Sciences
        start_date: 2013
        end_date: 2016

